services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classpulse_web
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "127.0.0.1:5055:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=sqlite:////app/data/classpulse.db
    volumes:
      - ./data:/app/data
      - ./models_cache:/app/models_cache

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: classpulse_tunnel
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://web:5000
