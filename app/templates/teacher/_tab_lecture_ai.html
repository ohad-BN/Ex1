{% from "macros/icons.html" import cp_icon %}
<!-- TAB 4: Dedicated AI Lecture Summarizer (Feature 4) -->
<section id="tab-ai-lectures" class="cp-tab-pane tab-pane">
  <div class="cp-card" style="margin-bottom:16px;">
    <div class="cp-card-header">
      <h2>
        {{ cp_icon('sparkles', 18) }}
        <span>AI Lecture Recording &amp; Summarizer</span>
      </h2>
    </div>

    <div class="cp-grid-2">
      <div class="cp-well">
        <label class="cp-label" for="lecture-media-input">Upload Audio / Video Recording</label>
        <div class="cp-row-wrap">
          <input type="file" id="lecture-media-input" class="cp-file-input" accept=".mp4,.wav,.mp3,.m4a,.ogg,.webm,.vtt,.srt,.txt" />
          <button type="button" class="cp-btn cp-btn--green cp-btn--sm" onclick="summarizeLecture(false)">
            {{ cp_icon('upload', 14) }}
            <span>Upload, Transcribe &amp; Summarize</span>
          </button>
        </div>
        <div id="lecture-ai-status" style="font-size:12px; font-weight:700; color:var(--cp-indigo-ink); margin-top:8px;"></div>
      </div>

      <div class="cp-well">
        <label class="cp-label" for="lecture-transcript-input">Or Paste Transcript / Notes Manually (Optional)</label>
        <textarea id="lecture-transcript-input" class="cp-textarea" rows="3" placeholder="Paste raw lecture transcript lines here..."></textarea>
      </div>
    </div>
  </div>

  <div class="cp-card">
    <div class="cp-card-header">
      <h2>
        {{ cp_icon('file-text', 18) }}
        <span>Published Study Guides &amp; Transcripts</span>
      </h2>
      <button type="button" class="cp-btn cp-btn--secondary cp-btn--sm" onclick="loadLectureArtifacts()">
        {{ cp_icon('refresh', 14) }}
        <span>Refresh</span>
      </button>
    </div>
    <div id="lecture-artifacts-list" style="max-height:620px; overflow-y:auto;"></div>
  </div>
</section>
