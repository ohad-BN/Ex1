{% from "macros/icons.html" import cp_icon %}
<!-- TAB 5: Dedicated Homework Cohort Analytics (Feature 5) -->
<section id="tab-homework" class="cp-tab-pane tab-pane">
  <div class="cp-card" style="margin-bottom:16px;">
    <div class="cp-card-header">
      <h2>
        {{ cp_icon('award', 18) }}
        <span>Homework Cohort Analytics ({{ selected_course.course_code }})</span>
      </h2>
      <button type="button" class="cp-btn cp-btn--secondary cp-btn--sm" onclick="seedSampleAssignment()">
        {{ cp_icon('zap', 14) }}
        <span>Seed Sample Cohort</span>
      </button>
    </div>

    <div class="cp-well cp-grid-asymmetric">
      <div>
        <label class="cp-label" for="hw-new-title">Create New Assignment</label>
        <div class="cp-input-action" style="margin-bottom:8px;">
          <input type="text" id="hw-new-title" class="cp-input" placeholder="New Assignment Title (e.g. Ex3 — Concurrency)" />
          <button type="button" class="cp-btn cp-btn--primary cp-btn--sm" onclick="createAssignment()">
            {{ cp_icon('plus', 14) }}
            <span>Create</span>
          </button>
        </div>
        <input type="text" id="hw-new-rubric" class="cp-input" placeholder="Grading rubric &amp; topics (e.g. OOP design, pytest coverage, error handling)" />
      </div>

      <div>
        <label class="cp-label" for="hw-assignment-select">Select Assignment to Inspect</label>
        <select id="hw-assignment-select" class="cp-select" onchange="renderSelectedAssignment()"></select>
      </div>
    </div>
  </div>

  <div class="cp-card">
    <div id="hw-cohort-kpis" class="cp-kpi-grid-3"></div>
    <div id="hw-top-tags" style="margin-bottom:14px; font-size:13px;"></div>
    <div class="cp-card-header" style="margin-top:4px;">
      <h3>
        {{ cp_icon('bar-chart', 17) }}
        <span>Student Submissions &amp; Comparative AI Reviews</span>
      </h3>
    </div>
    <div id="hw-submissions-list" style="max-height:480px; overflow-y:auto;"></div>
  </div>
</section>
