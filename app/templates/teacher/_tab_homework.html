    <!-- TAB 5: Dedicated Homework Cohort Analytics (Feature 5) -->
    <section id="tab-homework" class="tab-pane">
      <div class="card" style="margin-bottom:18px;">
        <h2>
          <span>&#128202; Homework Cohort Analytics ({{ selected_course.course_code }})</span>
          <button class="btn-secondary btn-sm" onclick="seedSampleAssignment()">&#9889; Seed Sample Cohort</button>
        </h2>
        <p style="font-size:13px; color:var(--muted); margin-top:0;">
          $O(1)$ incremental aggregation (cohort mean score, topic averages, error tags, student percentile) paired with Stage-2 zero-PII comparative AI code/solution reviews.
        </p>

        <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:14px; align-items:end; background:#0f172a; border:1px solid var(--border); border-radius:10px; padding:12px;">
          <div>
            <label style="font-size:11px; font-weight:700; color:var(--accent); display:block; margin-bottom:6px;">Create New Assignment</label>
            <div style="display:grid; grid-template-columns: 1fr auto; gap:8px; margin-bottom:8px;">
              <input type="text" id="hw-new-title" placeholder="New Assignment Title (e.g. Ex3 — Concurrency)" />
              <button class="btn-sm" onclick="createAssignment()">+ Create</button>
            </div>
            <input type="text" id="hw-new-rubric" placeholder="Grading rubric & topics (e.g. OOP design, pytest coverage, error handling)" />
          </div>

          <div>
            <label style="font-size:11px; font-weight:700; color:var(--muted); display:block; margin-bottom:6px;">Select Assignment to Inspect</label>
            <select id="hw-assignment-select" onchange="renderSelectedAssignment()" style="width:100%;"></select>
          </div>
        </div>
      </div>

      <div class="card">
        <div id="hw-cohort-kpis" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; margin-bottom:14px;"></div>
        <div id="hw-top-tags" style="margin-bottom:14px; font-size:13px;"></div>
        <h3 style="font-size:15px; margin:0 0 10px 0;">Student Submissions &amp; Comparative AI Reviews</h3>
        <div id="hw-submissions-list" style="max-height:480px; overflow-y:auto;"></div>
      </div>
    </section>
