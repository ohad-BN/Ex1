<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassPulse — Zoom Companion Chat ({{ session.session_code }})</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    header {
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #feed {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
    }
    .msg.pinned { border-color: #f59e0b; background: rgba(245, 158, 11, 0.12); }
    .ts { color: #38bdf8; font-family: monospace; font-weight: 700; }
    .cat {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>Zoom Companion Feed</strong>
      <span style="color:#94a3b8; font-size:12px;">({{ session.session_code }})</span>
    </div>
    <a href="{{ url_for('chat.export_chat_timeline', session_id=session.id) }}" style="color:#38bdf8; font-size:12px; text-decoration:none;">Export .txt</a>
  </header>
  <div id="feed"></div>

  <script>
    const SESSION_CODE = "{{ session.session_code }}";
    let chatMessages = {{ messages | tojson }};

    function renderFeed() {
      const el = document.getElementById("feed");
      if (!chatMessages.length) {
        el.innerHTML = '<div style="color:#94a3b8; text-align:center; margin-top:30px;">Waiting for student questions...</div>';
        return;
      }
      el.innerHTML = chatMessages.map((m) => `
        <div class="msg ${m.is_pinned ? 'pinned' : ''}">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <div>
              <span class="ts">[${m.offset_mmss}]</span>
              <strong>${m.author_name}</strong>
              <span class="cat">${m.category}</span>
            </div>
            <span style="color:#4ade80; font-weight:700;">+${m.upvotes}</span>
          </div>
          <div>${m.body}</div>
        </div>
      `).join("");
    }

    renderFeed();
    const socket = io();
    socket.on("connect", () => {
      socket.emit("join_session", { session_code: SESSION_CODE });
    });
    socket.on("chat:new", (msg) => {
      chatMessages.push(msg);
      renderFeed();
    });
    socket.on("chat:updated", (msg) => {
      const idx = chatMessages.findIndex((x) => x.id === msg.id);
      if (idx >= 0) chatMessages[idx] = msg;
      chatMessages.sort((a, b) => (b.is_pinned - a.is_pinned) || (a.id - b.id));
      renderFeed();
    });
  </script>
</body>
</html>
