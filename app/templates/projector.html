<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassPulse Projector — {{ session.session_code }}</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .qr-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(56, 189, 248, 0.25);
      margin: 18px 0;
    }
    .qr-card img { width: 420px; max-width: 82vw; height: auto; display: block; }
    .timer-bar {
      width: 420px;
      max-width: 82vw;
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .timer-fill {
      height: 100%;
      width: 100%;
      background: #38bdf8;
      transition: width 0.1s linear;
    }
    .counter-pill {
      font-size: 28px;
      font-weight: 800;
      background: #1e293b;
      border: 2px solid #38bdf8;
      padding: 10px 28px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <h1 style="margin:0; font-size:34px;">{{ session.title }}</h1>
  <div style="color:#94a3b8; font-size:18px; margin-top:6px;">
    Scan with your smartphone camera — QR rotates every {{ qr_payload.step_seconds }} seconds
  </div>

  <div class="qr-card">
    <img id="proj-qr" src="{{ qr_payload.svg_data_uri }}" alt="Live Attendance QR" />
  </div>

  <div class="timer-bar">
    <div class="timer-fill" id="proj-timer"></div>
  </div>

  <div class="counter-pill">
    <span id="proj-count">{{ qr_count }}</span> Students Checked In
  </div>

  <script>
    const SESSION_CODE = "{{ session.session_code }}";
    const PROJECTOR_TOKEN = "{{ projector_token or '' }}";
    const STEP_MS = {{ qr_payload.step_seconds * 1000 }};
    let lastRotate = Date.now();

    const socket = io();
    socket.on("connect", () => {
      socket.emit("join_session", { session_code: SESSION_CODE, projector_token: PROJECTOR_TOKEN });
    });
    socket.on("qr:rotate", (data) => {
      if (data.session_code !== SESSION_CODE) return;
      document.getElementById("proj-qr").src = data.svg_data_uri;
      lastRotate = Date.now();
    });
    socket.on("attendance:count_update", (data) => {
      if (data.session_code !== SESSION_CODE) return;
      document.getElementById("proj-count").textContent = data.qr_count;
    });

    setInterval(() => {
      socket.emit("qr:request_refresh", { session_code: SESSION_CODE, projector_token: PROJECTOR_TOKEN });
    }, STEP_MS);

    setInterval(() => {
      const pct = Math.max(0, 100 - ((Date.now() - lastRotate) / STEP_MS) * 100);
      document.getElementById("proj-timer").style.width = pct + "%";
    }, 80);
  </script>
</body>
</html>
